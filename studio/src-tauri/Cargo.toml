[package]
name = "missionnaire-studio"
version = "0.1.0"
description = "Missionnaire Studio — live broadcast switcher"
authors = ["Missionnaire Network"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "missionnaire_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only to switch off macOS window-occlusion detection — see lib.rs. Pinned to
# the versions Tauri already pulls in, so this adds no new crates to the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
