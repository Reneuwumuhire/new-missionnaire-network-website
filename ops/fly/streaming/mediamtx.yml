logLevel: info

authMethod: http
authHTTPAddress: http://127.0.0.1:8080/mediamtx-auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: yes

rtmp: yes
rtmpAddress: :1935

hls: no
webrtc: no
rtsp: yes
rtspAddress: :8554
srt: no

paths:
  all_others:
    source: publisher
    runOnReady: /app/select-publisher.sh
