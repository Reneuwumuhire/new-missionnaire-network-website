app = "missionnaire-network-web-prod"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  DEPLOY_TARGET = "node"
  LIBRARY_INDEXING_ENABLED = "0"
  PORT = "3000"
  PUBLIC_MAIN_URL = "https://missionnaire.net"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
