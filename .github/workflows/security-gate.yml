name: Web security gate

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir admin install --frozen-lockfile
      - run: npm run security:gate
