name: Deploy web apps to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-production-deploy
  cancel-in-progress: false

jobs:
  deploy-website:
    name: Deploy public website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set runtime secrets
        run: >-
          flyctl secrets set --stage --app missionnaire-network-web-prod
          MONGODB_URI="$MONGODB_URI"
          MONGODB_DB="$MONGODB_DB"
          AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          AWS_S3_BUCKET="$AWS_S3_BUCKET"
          AWS_S3_REGION="$AWS_S3_REGION"
      - name: Deploy
        run: flyctl deploy --config fly.web.toml --remote-only

  deploy-admin:
    name: Deploy admin panel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_ADMIN_DEPLOY_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set runtime secrets
        working-directory: admin
        run: >-
          flyctl secrets set --stage --app missionnaire-admin-panel-prod
          MONGODB_URI="$MONGODB_URI"
          AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          AWS_S3_BUCKET="$AWS_S3_BUCKET"
          AWS_S3_REGION="$AWS_S3_REGION"
      - name: Deploy
        working-directory: admin
        run: flyctl deploy --config fly.toml --remote-only
