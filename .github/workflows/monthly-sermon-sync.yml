name: Sync Branham Sermons

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

concurrency:
  group: monthly-sermon-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync official sermon resources
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ensure ffprobe is available
        run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Add new official sermon resources to MongoDB
        run: pnpm sermons:sync -- --write --insert-new

      - name: Copy new audio and PDFs to S3
        run: pnpm sermons:migrate-assets -- --write --concurrency=4

      - name: Store new audio durations
        run: pnpm sermons:backfill-durations -- --write --concurrency=4
